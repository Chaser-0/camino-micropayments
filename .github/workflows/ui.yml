name: Deploy ui

on:
  push:
    branches: [ "c4t" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: 24.x

    - name: Build
      run: |
        cd ui
        yarn --frozen-lockfile
        yarn build

    - name: Deploy to IPFS
      uses: filebase/ipfs-action@master
      id: ipfs
      timeout-minutes: 2
      with:
        path: ./ui/dist
        service: ipfs
        verbose: true
        host: localhost
        port: 5001
        protocol: http
        key: ipfs-action

    - name: Output hash
      run: echo ${{ steps.ipfs.outputs.hash }}
